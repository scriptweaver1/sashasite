<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sashimi's Audio Masterlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Shippori+Mincho:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pure-white: #ffffff;
            --cream-white: #fdfbf9;
            --blush-light: #fff5f3;
            --blush-medium: #ffefec;
            --salmon-pale: #ffd5cf;
            --salmon-light: #ffb8ad;
            --salmon-pink: #e8a091;
            --salmon-medium: #d4847a;
            --salmon-deep: #c25d5d;
            --text-dark: #4a3f3a;
            --text-medium: #6b5a52;
            --text-light: #8a7a72;
            --glow-salmon: rgba(232, 160, 145, 0.4);
            --font-display: 'Shippori Mincho', serif;
            --font-body: 'Zen Maru Gothic', sans-serif;
            --font-size-base: 16px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: var(--font-size-base); scroll-behavior: smooth; }
        body { font-family: var(--font-body); background: var(--cream-white); color: var(--text-dark); min-height: 100vh; line-height: 1.6; }
        body.font-default { --font-body: 'Zen Maru Gothic', sans-serif; }
        body.font-serif { --font-body: 'Shippori Mincho', serif; }
        body.font-accessible { --font-body: 'Atkinson Hyperlegible', sans-serif; }
        
        .background-image { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('background.jpg'); background-size: cover; background-position: center; opacity: 0.08; z-index: -2; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(255,245,243,0.95) 0%, rgba(253,251,249,0.9) 50%, rgba(255,239,236,0.95) 100%); pointer-events: none; z-index: -1; }
        
        /* Age Modal */
        .age-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(74, 63, 58, 0.97); z-index: 10000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .age-modal-overlay.hidden { display: none; }
        .age-modal { background: linear-gradient(145deg, var(--pure-white), var(--blush-light)); border: 2px solid var(--salmon-pink); border-radius: 20px; padding: 3rem; max-width: 480px; width: 90%; text-align: center; box-shadow: 0 20px 60px rgba(194, 93, 93, 0.2); }
        .age-modal-icon { font-size: 4rem; margin-bottom: 1.5rem; display: block; }
        .age-modal h2 { font-family: var(--font-display); font-size: 1.8rem; color: var(--salmon-deep); margin-bottom: 1rem; }
        .age-modal p { color: var(--text-medium); margin-bottom: 2rem; }
        .age-modal-buttons { display: flex; gap: 1rem; justify-content: center; }
        .age-btn { padding: 0.9rem 2.5rem; border-radius: 30px; font-family: var(--font-body); font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent; }
        .age-btn-confirm { background: linear-gradient(135deg, var(--salmon-pink), var(--salmon-deep)); color: var(--pure-white); }
        .age-btn-confirm:hover { transform: translateY(-2px); box-shadow: 0 8px 25px var(--glow-salmon); }
        .age-btn-deny { background: transparent; color: var(--text-medium); border-color: var(--salmon-pale); }
        .age-btn-deny:hover { border-color: var(--salmon-pink); }
        
        /* Header */
        .header { padding: 1.5rem 2rem; border-bottom: 1px solid rgba(232, 160, 145, 0.2); background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .header-content { max-width: 1400px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
        .logo { display: flex; align-items: center; gap: 0.8rem; }
        .logo-icon { font-size: 2rem; }
        .logo-text { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; background: linear-gradient(135deg, var(--salmon-deep), var(--salmon-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .header-controls { display: flex; gap: 0.8rem; align-items: center; }
        .search-container { position: relative; }
        .search-input { padding: 0.7rem 1rem 0.7rem 2.5rem; background: var(--pure-white); border: 2px solid var(--salmon-pale); border-radius: 25px; color: var(--text-dark); font-family: var(--font-body); font-size: 0.9rem; width: 250px; transition: all 0.3s ease; }
        .search-input:focus { outline: none; border-color: var(--salmon-pink); box-shadow: 0 0 15px var(--glow-salmon); width: 300px; }
        .search-icon { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--salmon-pink); width: 16px; height: 16px; }
        .settings-btn { display: flex; align-items: center; gap: 0.4rem; padding: 0.7rem 1rem; background: var(--pure-white); border: 2px solid var(--salmon-pale); border-radius: 20px; color: var(--salmon-deep); font-size: 0.85rem; cursor: pointer; transition: all 0.3s ease; }
        .settings-btn:hover { background: var(--blush-light); border-color: var(--salmon-pink); }
        .settings-btn svg { width: 16px; height: 16px; }
        
        /* Settings Panel */
        .settings-panel { position: fixed; top: 0; right: -320px; width: 300px; height: 100%; background: var(--pure-white); border-left: 2px solid var(--salmon-pale); z-index: 1000; padding: 1.5rem; transition: right 0.3s ease; overflow-y: auto; }
        .settings-panel.open { right: 0; }
        .settings-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(74, 63, 58, 0.3); z-index: 999; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .settings-overlay.open { opacity: 1; visibility: visible; }
        .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--salmon-pale); }
        .settings-title { font-family: var(--font-display); font-size: 1.2rem; color: var(--salmon-deep); }
        .settings-close { background: none; border: none; color: var(--text-medium); cursor: pointer; padding: 0.3rem; }
        .settings-section { margin-bottom: 1.5rem; }
        .settings-section h4 { font-size: 0.8rem; color: var(--text-medium); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.8rem; }
        .font-size-controls { display: flex; align-items: center; gap: 0.8rem; }
        .font-size-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--blush-light); border: 2px solid var(--salmon-pale); color: var(--text-dark); cursor: pointer; transition: all 0.3s ease; font-size: 1.1rem; }
        .font-size-btn:hover { background: var(--salmon-pink); color: var(--pure-white); }
        .font-size-value { flex: 1; text-align: center; font-weight: 600; }
        .font-options { display: flex; flex-direction: column; gap: 0.4rem; }
        .font-option { padding: 0.6rem 0.8rem; background: var(--blush-light); border: 2px solid transparent; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; text-align: left; font-size: 0.9rem; }
        .font-option:hover { border-color: var(--salmon-pale); }
        .font-option.active { background: var(--salmon-pale); border-color: var(--salmon-pink); }
        
        /* Main Content */
        .main-content { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
        
        /* Navigation */
        .nav-section { margin-bottom: 1.5rem; overflow-x: auto; }
        .nav-list { display: flex; flex-wrap: wrap; gap: 0.5rem; list-style: none; }
        .nav-item { display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1rem; background: var(--pure-white); border: 2px solid var(--salmon-pale); border-radius: 20px; cursor: pointer; transition: all 0.3s ease; color: var(--text-medium); font-size: 0.85rem; white-space: nowrap; }
        .nav-item:hover { border-color: var(--salmon-pink); color: var(--salmon-deep); }
        .nav-item.active { background: linear-gradient(135deg, var(--salmon-pink), var(--salmon-deep)); border-color: var(--salmon-deep); color: var(--pure-white); }
        .nav-icon { font-size: 1rem; }
        .nav-count { font-size: 0.7rem; padding: 0.15rem 0.4rem; background: rgba(194, 93, 93, 0.15); border-radius: 8px; }
        .nav-item.active .nav-count { background: rgba(255, 255, 255, 0.25); }
        
        /* Controls Bar */
        .controls-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.8rem; }
        .results-info { color: var(--text-medium); font-size: 0.9rem; }
        .results-count { font-weight: 700; color: var(--salmon-deep); }
        .sort-select { padding: 0.5rem 1rem; background: var(--pure-white); border: 2px solid var(--salmon-pale); border-radius: 15px; color: var(--text-dark); font-family: var(--font-body); font-size: 0.85rem; cursor: pointer; }
        .sort-select:focus { outline: none; border-color: var(--salmon-pink); }
        
        /* Cards Grid */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1rem; }
        
        /* Text-focused Card Design */
        .card { background: var(--pure-white); border-radius: 12px; padding: 1.2em; border: 2px solid var(--salmon-pale); box-shadow: 0 2px 10px rgba(194, 93, 93, 0.06); transition: all 0.3s ease; cursor: pointer; display: flex; flex-direction: column; gap: 0.8em; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(194, 93, 93, 0.12); border-color: var(--salmon-pink); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.8em; }
        .card-title { font-family: var(--font-display); font-size: 1.05em; font-weight: 600; color: var(--text-dark); line-height: 1.4; flex: 1; }
        .card-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3em; flex-shrink: 0; }
        .card-category { background: linear-gradient(135deg, var(--salmon-pink), var(--salmon-deep)); color: var(--pure-white); padding: 0.25em 0.6em; border-radius: 12px; font-size: 0.7em; font-weight: 600; white-space: nowrap; }
        .card-duration { color: var(--text-light); font-size: 0.75em; font-weight: 500; }
        .card-date { color: var(--text-light); font-size: 0.7em; }
        
        /* Credits */
        .card-credits { display: flex; flex-wrap: wrap; gap: 0.4em; }
        .credit-pill { display: inline-flex; align-items: center; gap: 0.25em; background: var(--blush-light); border: 1px solid var(--salmon-pale); border-radius: 15px; padding: 0.25em 0.6em; font-size: 0.72em; }
        .credit-label { font-weight: 600; color: var(--salmon-deep); }
        .credit-link { color: var(--salmon-medium); text-decoration: none; }
        .credit-link:hover { color: var(--salmon-deep); text-decoration: underline; }
        
        /* Tags */
        .card-tags { display: flex; flex-wrap: wrap; gap: 0.3em; }
        .tag { background: var(--blush-medium); color: var(--text-medium); padding: 0.2em 0.5em; border-radius: 10px; font-size: 0.68em; border: 1px solid var(--salmon-pale); cursor: pointer; transition: all 0.2s ease; }
        .tag:hover { background: var(--salmon-pink); color: var(--pure-white); }
        .tag-expand-btn { background: var(--salmon-pink); color: var(--pure-white); padding: 0.2em 0.5em; border-radius: 10px; font-size: 0.68em; font-weight: 600; border: none; cursor: pointer; }
        .hidden-tags { display: none; }
        .hidden-tags.show { display: inline; }
        
        /* Synopsis */
        .card-synopsis { color: var(--text-medium); font-size: 0.82em; line-height: 1.5; }
        
        /* Link Buttons */
        .card-links { display: flex; gap: 0.5em; margin-top: auto; padding-top: 0.5em; }
        .link-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.4em; padding: 0.6em 1em; border-radius: 20px; font-size: 0.8em; font-weight: 600; text-decoration: none; transition: all 0.3s ease; }
        .link-btn-reddit { background: #ff4500; color: white; }
        .link-btn-reddit:hover { background: #e03d00; transform: translateY(-2px); }
        .link-btn-patreon { background: #f96854; color: white; }
        .link-btn-patreon:hover { background: #e85a47; transform: translateY(-2px); }
        .link-btn-single { background: linear-gradient(135deg, var(--salmon-pink), var(--salmon-deep)); color: white; }
        .link-btn-single:hover { transform: translateY(-2px); box-shadow: 0 4px 15px var(--glow-salmon); }
        
        /* Load More */
        .load-more-container { text-align: center; margin-top: 2rem; }
        .load-more-btn { padding: 1rem 3rem; background: linear-gradient(135deg, var(--salmon-pink), var(--salmon-deep)); color: white; border: none; border-radius: 30px; font-family: var(--font-body); font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .load-more-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px var(--glow-salmon); }
        .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .load-more-info { color: var(--text-light); font-size: 0.9rem; margin-top: 0.8rem; }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 3rem; color: var(--text-light); grid-column: 1 / -1; }
        .empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
        .empty-title { font-family: var(--font-display); font-size: 1.3rem; color: var(--text-medium); margin-bottom: 0.5rem; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header-content { flex-direction: column; align-items: stretch; }
            .header-controls { justify-content: center; flex-wrap: wrap; }
            .search-input { width: 100%; }
            .search-input:focus { width: 100%; }
            .cards-grid { grid-template-columns: 1fr; }
            .logo { justify-content: center; }
        }
    </style>
</head>
<body class="font-default">
    <div class="background-image"></div>

    <div class="age-modal-overlay" id="ageModal">
        <div class="age-modal">
            <span class="age-modal-icon">🍣</span>
            <h2>Age Verification Required</h2>
            <p>This website contains adult content. You must be at least 18 years old to enter.</p>
            <div class="age-modal-buttons">
                <button class="age-btn age-btn-confirm" onclick="verifyAge(true)">I am 18+</button>
                <button class="age-btn age-btn-deny" onclick="verifyAge(false)">Leave</button>
            </div>
        </div>
    </div>

    <header class="header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🍣</span>
                <span class="logo-text">Sashimi's Audio Masterlist</span>
            </div>
            <div class="header-controls">
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search audios, tags...">
                </div>
                <button class="settings-btn" onclick="toggleSettings()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    Settings
                </button>
            </div>
        </div>
    </header>

    <div class="settings-overlay" id="settingsOverlay" onclick="toggleSettings()"></div>
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h3 class="settings-title">Settings</h3>
            <button class="settings-close" onclick="toggleSettings()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="settings-section">
            <h4>Font Size</h4>
            <div class="font-size-controls">
                <button class="font-size-btn" onclick="adjustFontSize(-2)">−</button>
                <span class="font-size-value" id="fontSizeValue">16px</span>
                <button class="font-size-btn" onclick="adjustFontSize(2)">+</button>
            </div>
        </div>
        <div class="settings-section">
            <h4>Font Style</h4>
            <div class="font-options">
                <button class="font-option active" data-font="default" onclick="setFont('default')">Zen Maru Gothic</button>
                <button class="font-option" data-font="serif" onclick="setFont('serif')">Shippori Mincho</button>
                <button class="font-option" data-font="accessible" onclick="setFont('accessible')">Atkinson Hyperlegible</button>
            </div>
        </div>
    </div>

    <main class="main-content">
        <nav class="nav-section">
            <ul class="nav-list" id="navList"></ul>
        </nav>
        <div class="controls-bar">
            <div class="results-info">Showing <span class="results-count" id="resultsCount">0</span> audios</div>
            <select class="sort-select" id="sortSelect" onchange="handleSort()">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="title">Title A-Z</option>
            </select>
        </div>
        <div class="cards-grid" id="cardsGrid"></div>
        <div class="load-more-container" id="loadMoreContainer">
            <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">Load More</button>
            <p class="load-more-info" id="loadMoreInfo"></p>
        </div>
    </main>

    <script>
        const CONFIG = {
            categories: {
                all: { title: 'All', icon: '🍱' },
                fdom: { title: 'Fdom', icon: '⛓️' },
                fsub: { title: 'Fsub', icon: '🎀' },
                fswitch: { title: 'Fswitch', icon: '🔄' },
                'dirty-talk': { title: 'Dirty Talk', icon: '🔥' },
                collab: { title: 'Collab', icon: '🤝' },
                f4f: { title: 'F4F', icon: '💕' },
                sfw: { title: 'SFW', icon: '☁️' },
                'script-offer': { title: 'Script Offer', icon: '📝' }
            },
            itemsPerPage: 60
        };

        let AUDIOS_DATA = [];
        let currentCategory = 'all';
        let currentSearch = '';
        let currentSort = 'newest';
        let displayedCount = 0;
        let filteredAudios = [];

        // Load data
        async function loadData() {
            try {
                const response = await fetch('audios.json');
                AUDIOS_DATA = await response.json();
                init();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('cardsGrid').innerHTML = '<div class="empty-state"><div class="empty-icon">❌</div><h3 class="empty-title">Error loading data</h3></div>';
            }
        }

        function verifyAge(isAdult) {
            if (isAdult) { localStorage.setItem('ageVerified', 'true'); document.getElementById('ageModal').classList.add('hidden'); }
            else { window.location.href = 'https://www.google.com'; }
        }
        function checkAgeVerification() { if (localStorage.getItem('ageVerified') === 'true') document.getElementById('ageModal').classList.add('hidden'); }
        function toggleSettings() { document.getElementById('settingsPanel').classList.toggle('open'); document.getElementById('settingsOverlay').classList.toggle('open'); }

        let currentFontSize = 16;
        function adjustFontSize(delta) {
            currentFontSize = Math.min(28, Math.max(12, currentFontSize + delta));
            document.documentElement.style.setProperty('--font-size-base', currentFontSize + 'px');
            document.getElementById('fontSizeValue').textContent = currentFontSize + 'px';
            localStorage.setItem('fontSize', currentFontSize);
        }
        function setFont(fontType) {
            document.body.className = 'font-' + fontType;
            document.querySelectorAll('.font-option').forEach(btn => btn.classList.toggle('active', btn.dataset.font === fontType));
            localStorage.setItem('fontType', fontType);
        }
        function loadSettings() {
            const savedFontSize = localStorage.getItem('fontSize');
            const savedFontType = localStorage.getItem('fontType');
            if (savedFontSize) { currentFontSize = parseInt(savedFontSize); document.documentElement.style.setProperty('--font-size-base', currentFontSize + 'px'); document.getElementById('fontSizeValue').textContent = currentFontSize + 'px'; }
            if (savedFontType) setFont(savedFontType);
        }

        function buildNav() {
            const counts = { all: AUDIOS_DATA.length };
            AUDIOS_DATA.forEach(a => { counts[a.category] = (counts[a.category] || 0) + 1; });
            
            const navList = document.getElementById('navList');
            navList.innerHTML = Object.entries(CONFIG.categories)
                .filter(([key]) => key === 'all' || counts[key])
                .map(([key, val]) => `
                    <li class="nav-item ${key === 'all' ? 'active' : ''}" data-category="${key}">
                        <span class="nav-icon">${val.icon}</span>
                        <span>${val.title}</span>
                        <span class="nav-count">${counts[key] || 0}</span>
                    </li>
                `).join('');
            
            navList.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    navList.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    currentCategory = item.dataset.category;
                    resetAndRender();
                });
            });
        }

        function filterAudios() {
            let filtered = [...AUDIOS_DATA];
            
            if (currentCategory !== 'all') {
                filtered = filtered.filter(a => a.category === currentCategory);
            }
            
            if (currentSearch) {
                const search = currentSearch.toLowerCase();
                filtered = filtered.filter(a => 
                    a.title.toLowerCase().includes(search) || 
                    a.tags.toLowerCase().includes(search) || 
                    a.synopsis.toLowerCase().includes(search)
                );
            }
            
            // Sort
            if (currentSort === 'newest') {
                filtered.sort((a, b) => (b.datePosted || '').localeCompare(a.datePosted || ''));
            } else if (currentSort === 'oldest') {
                filtered.sort((a, b) => (a.datePosted || '').localeCompare(b.datePosted || ''));
            } else if (currentSort === 'title') {
                filtered.sort((a, b) => a.title.localeCompare(b.title));
            }
            
            return filtered;
        }

        function parseTags(tagString) {
            if (!tagString) return [];
            return tagString.match(/\[([^\]]+)\]/g)?.map(t => t.slice(1, -1)) || [];
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const [year, month, day] = dateStr.split('-');
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${months[parseInt(month) - 1]} ${parseInt(day)}, ${year}`;
        }

        function buildCreditsHtml(audio) {
            let credits = [];
            
            if (audio.scriptAuthor) {
                let html = '<div class="credit-pill"><span class="credit-label">📝</span> ';
                html += audio.scriptAuthorPage ? `<a href="${audio.scriptAuthorPage}" target="_blank" class="credit-link" onclick="event.stopPropagation()">${audio.scriptAuthor}</a>` : audio.scriptAuthor;
                if (audio.scriptLink) html += ` <a href="${audio.scriptLink}" target="_blank" class="credit-link" onclick="event.stopPropagation()">(script)</a>`;
                html += '</div>';
                credits.push(html);
            }
            
            if (audio.audioEditor) {
                let html = '<div class="credit-pill"><span class="credit-label">🎧</span> ';
                html += audio.audioEditorPage ? `<a href="${audio.audioEditorPage}" target="_blank" class="credit-link" onclick="event.stopPropagation()">${audio.audioEditor}</a>` : audio.audioEditor;
                html += '</div>';
                credits.push(html);
            }
            
            if (audio.collabPartners?.length) {
                let html = '<div class="credit-pill"><span class="credit-label">🎙️</span> ';
                html += audio.collabPartners.map(p => p.link ? `<a href="${p.link}" target="_blank" class="credit-link" onclick="event.stopPropagation()">${p.name}</a>` : p.name).join(', ');
                html += '</div>';
                credits.push(html);
            }
            
            return credits.length ? `<div class="card-credits">${credits.join('')}</div>` : '';
        }

        function buildTagsHtml(audio) {
            const tags = parseTags(audio.tags);
            if (!tags.length) return '';
            
            const maxVisible = 4;
            const visible = tags.slice(0, maxVisible);
            const hidden = tags.slice(maxVisible);
            
            let html = visible.map(t => `<span class="tag">${t}</span>`).join('');
            
            if (hidden.length) {
                html += `<button class="tag-expand-btn" onclick="event.stopPropagation(); toggleTags(this)">+${hidden.length}</button>`;
                html += `<span class="hidden-tags">${hidden.map(t => `<span class="tag">${t}</span>`).join('')}</span>`;
            }
            
            return `<div class="card-tags">${html}</div>`;
        }

        function buildLinksHtml(audio) {
            const hasReddit = !!audio.redditLink;
            const hasPatreon = !!audio.patreonLink;
            
            if (hasReddit && hasPatreon) {
                return `
                    <div class="card-links">
                        <a href="${audio.redditLink}" target="_blank" class="link-btn link-btn-reddit" onclick="event.stopPropagation()">▶ Reddit</a>
                        <a href="${audio.patreonLink}" target="_blank" class="link-btn link-btn-patreon" onclick="event.stopPropagation()">▶ Patreon</a>
                    </div>`;
            } else if (hasReddit) {
                return `<div class="card-links"><a href="${audio.redditLink}" target="_blank" class="link-btn link-btn-single" onclick="event.stopPropagation()">▶ Listen on Reddit</a></div>`;
            } else if (hasPatreon) {
                return `<div class="card-links"><a href="${audio.patreonLink}" target="_blank" class="link-btn link-btn-single" onclick="event.stopPropagation()">▶ Listen on Patreon</a></div>`;
            }
            return '';
        }

        function createCard(audio) {
            const categoryInfo = CONFIG.categories[audio.category] || { title: audio.category, icon: '🎧' };
            
            return `
                <div class="card" onclick="handleCardClick('${audio.redditLink || audio.patreonLink}')">
                    <div class="card-header">
                        <h3 class="card-title">${audio.title}</h3>
                        <div class="card-meta">
                            <span class="card-category">${categoryInfo.icon} ${categoryInfo.title}</span>
                            ${audio.duration ? `<span class="card-duration">${audio.duration}</span>` : ''}
                            ${audio.datePosted ? `<span class="card-date">${formatDate(audio.datePosted)}</span>` : ''}
                        </div>
                    </div>
                    ${buildCreditsHtml(audio)}
                    ${buildTagsHtml(audio)}
                    ${audio.synopsis ? `<p class="card-synopsis">${audio.synopsis.substring(0, 200)}${audio.synopsis.length > 200 ? '...' : ''}</p>` : ''}
                    ${buildLinksHtml(audio)}
                </div>`;
        }

        function toggleTags(btn) {
            const hidden = btn.nextElementSibling;
            const isShowing = hidden.classList.contains('show');
            hidden.classList.toggle('show');
            btn.textContent = isShowing ? `+${hidden.querySelectorAll('.tag').length}` : '−';
        }

        function handleCardClick(link) {
            if (link) window.open(link, '_blank');
        }

        function handleSort() {
            currentSort = document.getElementById('sortSelect').value;
            resetAndRender();
        }

        function resetAndRender() {
            displayedCount = 0;
            filteredAudios = filterAudios();
            document.getElementById('cardsGrid').innerHTML = '';
            loadMore();
        }

        function loadMore() {
            const grid = document.getElementById('cardsGrid');
            const toShow = filteredAudios.slice(displayedCount, displayedCount + CONFIG.itemsPerPage);
            
            if (displayedCount === 0 && filteredAudios.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🍙</div><h3 class="empty-title">No audios found</h3><p>Try adjusting your search or category</p></div>';
            } else {
                grid.innerHTML += toShow.map(createCard).join('');
            }
            
            displayedCount += toShow.length;
            
            document.getElementById('resultsCount').textContent = filteredAudios.length;
            
            const remaining = filteredAudios.length - displayedCount;
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            const loadMoreInfo = document.getElementById('loadMoreInfo');
            
            if (remaining > 0) {
                loadMoreBtn.style.display = 'inline-block';
                loadMoreBtn.textContent = `Load More (${Math.min(remaining, CONFIG.itemsPerPage)} more)`;
                loadMoreInfo.textContent = `Showing ${displayedCount} of ${filteredAudios.length} audios`;
            } else {
                loadMoreBtn.style.display = 'none';
                loadMoreInfo.textContent = filteredAudios.length > 0 ? `Showing all ${filteredAudios.length} audios` : '';
            }
        }

        function initSearch() {
            const searchInput = document.getElementById('searchInput');
            let timeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => {
                    currentSearch = e.target.value;
                    resetAndRender();
                }, 300);
            });
            
            document.getElementById('cardsGrid').addEventListener('click', (e) => {
                if (e.target.classList.contains('tag')) {
                    e.stopPropagation();
                    searchInput.value = e.target.textContent;
                    currentSearch = e.target.textContent;
                    resetAndRender();
                }
            });
        }

        function init() {
            checkAgeVerification();
            loadSettings();
            buildNav();
            initSearch();
            resetAndRender();
        }

        // Start loading
        loadData();
    </script>
</body>
</html>
